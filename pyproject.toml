[project]
name = "telegram-gifts-subscription-bot"
version = "0.1.0"
description = "Telegram bot with Stars subscriptions, private chat access, admin panel, and gift resale monitoring."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.28,<4",
  "aiohttp>=3.9,<4",
  "aiosqlite>=0.20,<1",
  "cryptography>=42,<46",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "Telethon>=1.43.2,<2",
  "tzdata>=2025.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
